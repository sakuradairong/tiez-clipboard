[package]
name = "tiez-winui-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiez-core = { path = "../../../crates/tiez-core" }

[profile.release]
lto = "thin"
strip = "symbols"
