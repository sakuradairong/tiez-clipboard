name: "Build Tauri fallback platforms"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact_name: tiez-linux-x64
            artifact_path: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
            artifact_name: tiez-macos-arm64
            artifact_path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
            artifact_name: tiez-macos-x64
            artifact_path: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    env:
      CI: true
      VITE_ENABLE_UPDATER: "false"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            xvfb \
            xdotool

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release versions
        run: npm run verify:versions

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust backend
        run: npm run test:rust

      - name: Test Linux clipboard round trips under X11
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --test linux_clipboard_integration -- --nocapture --test-threads=1

      - name: Build platform bundles
        run: npx tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --config .github/tauri-build-test.conf.json --no-sign --ci

      - name: Verify Linux bundles
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
          chmod +x src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
          src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null

      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil verify src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
