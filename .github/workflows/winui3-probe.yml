name: Windows native WinUI

# Builds the production native TieZ.exe + its Rust core DLL on a Windows runner.
# Linux hosts cannot run the XAML/XBF compiler, so the complete exe is produced here;
# the Rust core can be developed and cross-compiled locally on Linux (cargo-xwin).
# Reuses experiments/winui3-main-window/build.ps1 (test -> cargo -> nuget restore -> msbuild).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/tiez-core/**"
      - "experiments/winui3-main-window/**"
      - "scripts/verify-windows-native-release.mjs"
      - "package.json"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - ".github/workflows/build-platforms.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/winui3-probe.yml"
  push:
    branches: [master]
    paths:
      - "crates/tiez-core/**"
      - "experiments/winui3-main-window/**"
      - "scripts/verify-windows-native-release.mjs"
      - "package.json"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - ".github/workflows/build-platforms.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/winui3-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust (1.88.0 per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Windows native release contract
        run: npm run verify:windows-release

      - name: Build (build.ps1)
        working-directory: experiments/winui3-main-window
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Platform x64

      - name: Test native release readiness
        working-directory: experiments/winui3-main-window
        shell: pwsh
        run: ./test-release-readiness.ps1 -Configuration Release

      - name: Test configured native global hotkey
        working-directory: experiments/winui3-main-window
        shell: pwsh
        run: ./test-hotkey.ps1 -Configuration Release

      - name: Validate unsigned MSIX
        working-directory: experiments/winui3-main-window
        shell: pwsh
        run: ./package-msix.ps1 -SkipBuild

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tiez-winui-x64
          path: |
            experiments/winui3-main-window/artifacts/x64/Release/
            experiments/winui3-main-window/artifacts/packages/
          if-no-files-found: error
