name: winui3-probe

# Builds the WinUI 3 probe (Tiez.WinUIProbe) + its Rust core DLL on a Windows runner.
# Linux hosts cannot run the XAML/XBF compiler, so the complete exe is produced here;
# the Rust core can be developed and cross-compiled locally on Linux (cargo-xwin).
# Reuses experiments/winui3-main-window/build.ps1 (test -> cargo -> nuget restore -> msbuild).

on:
  workflow_dispatch:
  push:
    branches: [explore/winui3-main-window]
    paths:
      - "crates/tiez-core/**"
      - "experiments/winui3-main-window/**"
      - ".github/workflows/winui3-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust (1.88.0 per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"

      - name: Build (build.ps1)
        working-directory: experiments/winui3-main-window
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Platform x64

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winui3-probe-x64
          path: experiments/winui3-main-window/artifacts/x64/Release/
          if-no-files-found: warn
