name: Install wizard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installer-bootstrap/**"
      - ".github/workflows/bootstrapper.yml"
      - ".github/workflows/release.yml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/nsis/**"
  push:
    branches:
      - master
    paths:
      - "installer-bootstrap/**"
      - ".github/workflows/bootstrapper.yml"
      - ".github/workflows/release.yml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/nsis/**"

permissions:
  contents: read

jobs:
  linux-checks:
    name: Wizard checks on Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer-bootstrap/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0

      - name: Install wizard frontend dependencies
        run: npm ci --prefix installer-bootstrap

      - name: Test and build the wizard frontend
        run: |
          npm test --prefix installer-bootstrap
          npm run build --prefix installer-bootstrap

      - name: Test install-argument decisions
        run: cargo test --manifest-path installer-bootstrap/Cargo.toml -p tiez-installer-core

      - name: Check updater contract
        run: node installer-bootstrap/scripts/assert-release-contract.mjs

  windows-build:
    name: Windows wizard with embedded NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            src-tauri -> target
            installer-bootstrap -> target

      - name: Install app dependencies
        run: npm ci

      - name: Build inner NSIS setup
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config .github/tauri-build-test.conf.json --no-sign --ci

      - name: Embed setup and build the wizard
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup -or $setup.Length -eq 0) { throw "Inner NSIS setup.exe was not produced" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\installer-bootstrap\scripts\embed-and-build.ps1 -SetupPath $setup.FullName

      - name: Upload install wizard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tiez-windows-x64-bootstrapper
          path: installer-bootstrap/dist-bootstrapper/TieZ-*-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 7
