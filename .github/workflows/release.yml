name: "Publish Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Verify release versions
        run: npm run verify:versions

      - name: Verify Windows native release contract
        run: npm run verify:windows-release

  publish-tauri:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu --bundles deb,appimage'
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - name: macOS Intel
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg'

    name: Tauri fallback · ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: install dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            xvfb \
            xdotool

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}

      - name: install frontend dependencies
        run: npm ci

      - name: test frontend
        run: npm test

      - name: build frontend
        run: npm run build

      - name: test Rust backend
        run: npm run test:rust

      - name: test Linux clipboard round trips under X11
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --test linux_clipboard_integration -- --nocapture --test-threads=1

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ENABLE_UPDATER: "true"
        with:
          tagName: v__VERSION__
          releaseName: "TieZ v__VERSION__"
          releaseBody: |
            Multi-platform release from the maintained TieZ community fork.

            Windows x64 uses the native WinUI 3 application distributed as a signed MSIX with an App Installer update feed. Linux x64, macOS Apple Silicon, and macOS Intel retain the Tauri application.

            Linux automatic paste uses xdotool on X11 or wtype on Wayland. macOS builds are not notarized yet and may require explicit Pasteboard and Accessibility permission.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-winui-windows:
    name: Windows x64 native WinUI MSIX
    needs:
      - preflight
      - publish-tauri
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINUI_MSIX_CERTIFICATE_BASE64: ${{ secrets.WINUI_MSIX_CERTIFICATE_BASE64 }}
      WINUI_MSIX_CERTIFICATE_PASSWORD: ${{ secrets.WINUI_MSIX_CERTIFICATE_PASSWORD }}
      WINUI_MSIX_PUBLISHER: ${{ secrets.WINUI_MSIX_PUBLISHER }}
      WINUI_MSIX_TIMESTAMP_URL: ${{ vars.WINUI_MSIX_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc

      - name: Validate native signing configuration
        shell: pwsh
        run: |
          $required = @(
            "WINUI_MSIX_CERTIFICATE_BASE64",
            "WINUI_MSIX_CERTIFICATE_PASSWORD",
            "WINUI_MSIX_PUBLISHER",
            "WINUI_MSIX_TIMESTAMP_URL"
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing required native release setting: $name"
            }
          }
          [System.IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP "tiez-winui-release.pfx"),
            [Convert]::FromBase64String($env:WINUI_MSIX_CERTIFICATE_BASE64)
          )

      - name: Build native WinUI release
        shell: pwsh
        run: ./experiments/winui3-main-window/build.ps1 -Configuration Release

      - name: Test native WinUI single-instance activation
        shell: pwsh
        run: ./experiments/winui3-main-window/test-single-instance.ps1 -Configuration Release -LifecycleCycles 10

      - name: Test configured native WinUI global hotkey
        shell: pwsh
        run: ./experiments/winui3-main-window/test-hotkey.ps1 -Configuration Release

      - name: Package and verify signed native MSIX
        shell: pwsh
        run: |
          $arguments = @{
            SkipBuild = $true
            Publisher = $env:WINUI_MSIX_PUBLISHER
            CertificatePath = (Join-Path $env:RUNNER_TEMP "tiez-winui-release.pfx")
            CertificatePassword = $env:WINUI_MSIX_CERTIFICATE_PASSWORD
            TimestampUrl = $env:WINUI_MSIX_TIMESTAMP_URL
            AppInstallerBaseUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
            RequireSigning = $true
          }
          ./experiments/winui3-main-window/package-msix.ps1 @arguments

      - name: Upload native assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (node scripts/verify-release-versions.mjs --print).Trim()
          $assets = @(Get-ChildItem experiments/winui3-main-window/artifacts/packages -File |
            ForEach-Object FullName)
          if ($assets.Count -ne 3) {
            throw "Expected signed MSIX, SHA256, and App Installer assets; found $($assets.Count)."
          }
          gh release upload "v$version" @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload native WinUI release assets."
          }

      - name: Remove decoded signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "tiez-winui-release.pfx") -Force -ErrorAction SilentlyContinue
