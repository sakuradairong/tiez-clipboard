[package]
name = "tiez-native-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[[test]]
name = "open_process"
path = "tests/open_process.rs"
harness = false
