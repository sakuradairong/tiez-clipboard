[package]
name = "tiez-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
portable = []

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2.1.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
