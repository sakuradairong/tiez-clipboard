[package]
name = "tiez-native-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "tiez_native_core"
crate-type = ["rlib", "cdylib"]

[features]
portable = ["tiez-storage/portable", "tiez-content/portable"]

[dependencies]
tiez-content = { path = "../content" }
tiez-native-platform = { path = "../platform" }
regex = "1.12.2"
# Same interpolation parser used by regex; count expansion before allocating preview output.
regex-automata = "0.4.18"
tiez-storage = { path = "../storage" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
