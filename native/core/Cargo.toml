[package]
name = "tiez-native-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "tiez_native_core"
crate-type = ["rlib", "cdylib"]

[features]
portable = ["tiez-storage/portable", "tiez-content/portable"]

[dependencies]
tiez-content = { path = "../content" }
tiez-native-platform = { path = "../platform" }
regex = "1.12.2"
# Same interpolation parser used by regex; count expansion before allocating preview output.
regex-automata = "0.4.18"
tiez-storage = { path = "../storage" }
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
zeroize = "=1.9.0"
# Newer UUID releases require Rust 1.89; preserve the repository toolchain.
uuid = { version = "=1.19.0", features = ["v4"] }

[[test]]
name = "open_core_process"
path = "tests/open_core_process.rs"
harness = false
