[package]
name = "tiez-content"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
portable = ["tiez-storage/portable"]

[dependencies]
tiez-storage = { path = "../storage" }
tiez-native-platform = { path = "../platform" }
base64 = "0.22"
regex = "1.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
[dev-dependencies]
uuid = { version = "1.19.0", features = ["v4"] }
